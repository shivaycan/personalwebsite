<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#10110f" />
  <title>vaynotes — a place for thoughts</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap');
    :root{font-family:"OpenAI Sans","DM Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#f1f0e9;background:#000;color-scheme:dark;font-synthesis:none;text-rendering:optimizeLegibility;--muted:#85877f;--line:rgba(255,255,255,.12);--serif:"Instrument Serif",Georgia,serif;--mono:"DM Mono",monospace}
    *{box-sizing:border-box}html{background:#000;scroll-behavior:smooth}body{margin:0;min-height:100vh;background:#000;overscroll-behavior-y:contain}button,input,textarea{font:inherit}button{color:inherit;cursor:pointer;touch-action:manipulation}.grain{display:none}
    .shell{max-width:1440px;margin:auto;padding:0 54px}.topbar{height:76px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:6;background:#000}.brand{font-size:19px;font-weight:600;letter-spacing:-.06em;text-decoration:none;color:#f2f0e8}.brand i{color:#a4b28e;font-style:normal}.nav{display:flex;align-items:center;gap:29px}.nav a,.nav button{color:#aaa99f;text-decoration:none;font-size:12px;background:none;border:0;padding:12px 0;min-height:44px;display:inline-flex;align-items:center;transition:color .2s}.nav a:hover,.nav button:hover{color:#fff}.nav .write-link{color:#f1f0e9;border-bottom:1px solid #d4d2c7}
    .intro{padding:78px 0 38px;display:grid;grid-template-columns:1fr;align-items:end;transition:padding .38s cubic-bezier(.2,.8,.2,1),background .25s}.intro h1{font:400 clamp(48px,7vw,92px)/.94 var(--serif);letter-spacing:-.045em;margin:20px 0 14px;outline:none;min-height:1em;overflow-wrap:anywhere;caret-color:#d4d2c7;transition:font-size .34s cubic-bezier(.2,.8,.2,1),margin .34s,letter-spacing .34s,color .25s,transform .34s}.intro h1:empty:before{content:attr(data-placeholder);color:#f1f0e9;opacity:1}.intro.started{position:sticky;top:76px;z-index:4;padding:12px 0;background:rgba(0,0,0,.96);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}.intro.started h1{font-size:clamp(24px,3vw,34px);line-height:1.05;letter-spacing:-.02em;margin:0}.section-label{display:flex;align-items:center;gap:14px;color:#73766e;font:10px var(--mono);letter-spacing:.15em;text-transform:uppercase;margin:25px 0 17px}.section-label:after{content:"";height:1px;background:var(--line);flex:1}
    .composer{display:none;position:relative;background:#000;min-height:290px;padding:30px 34px 24px;transition:background .3s,color .3s,transform .35s;overflow:hidden;animation:pad-rise .42s cubic-bezier(.2,.8,.2,1) both}.intro.started+.composer{display:block}@keyframes pad-rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}.composer[data-theme="forest"]{background:#124e3c;color:#f1f3e8}.composer[data-theme="paper"]{background:#e8e3d6;color:#272720}.composer[data-theme="oxblood"]{background:#6e1118;color:#f4e9dd}.composer[data-theme="blue"]{background:#182f4e;color:#eaf0f5}.composer[data-theme="lavender"]{background:#403649;color:#f0eafa}.composer[data-theme="graph"]{background-color:#164e3b;background-image:linear-gradient(rgba(222,239,216,.18) 1px,transparent 1px),linear-gradient(90deg,rgba(222,239,216,.18) 1px,transparent 1px);background-size:38px 38px;color:#f1f3e8}
    .compose-head{display:flex;align-items:center;justify-content:space-between;gap:20px}.compose-kicker{font:10px var(--mono);letter-spacing:.12em;text-transform:uppercase;opacity:.62}.theme-picker{display:flex;align-items:center;gap:2px}.theme-dot{width:38px;height:38px;border:0;border-radius:50%;padding:0;background:transparent;position:relative;display:grid;place-items:center;flex:0 0 38px}.theme-dot:before{content:"";width:19px;height:19px;border:1px solid rgba(255,255,255,.4);border-radius:50%;background:var(--swatch);transition:transform .2s,box-shadow .2s}.theme-dot:hover:before{transform:scale(1.13)}.theme-dot.active:after{content:"";position:absolute;inset:3px;border:1px solid currentColor;border-radius:50%;opacity:.75}.compose-title{display:block;width:100%;margin:24px 0 6px;padding:0;background:transparent;border:0;outline:0;color:inherit;font:400 35px/1.1 var(--serif);letter-spacing:-.025em}.compose-title::placeholder,.editor:empty:before{color:inherit;opacity:.4}.editor{width:100%;min-height:105px;outline:0;border:0;background:transparent;color:inherit;font-size:16px;line-height:1.75;white-space:pre-wrap;overflow-wrap:anywhere;caret-color:currentColor}.editor:empty:before{content:attr(data-placeholder);pointer-events:none}.editor blockquote{border-left:2px solid currentColor;padding-left:14px;margin-left:0;opacity:.85}.editor a{color:inherit}.compose-bottom{margin-top:15px;display:flex;align-items:center;justify-content:space-between;gap:15px}.format-tools{display:flex;gap:2px}.format-tools button,.quiet-btn{background:none;border:0;border-radius:8px;color:inherit;opacity:.72;padding:7px 8px;font-size:13px;min-width:42px;min-height:44px;display:grid;place-items:center;transition:opacity .18s,background .18s,transform .18s}.format-tools button:hover,.quiet-btn:hover{opacity:1;background:rgba(255,255,255,.1)}.format-tools button:active{transform:scale(.92)}.compose-actions{display:flex;align-items:center;gap:17px}.word-count{font:10px var(--mono);opacity:.55}.vay-btn{border:0;border-radius:999px;background:#f0eee5;color:#191a16;padding:11px 22px;min-height:44px;font-size:13px;font-weight:600;letter-spacing:.015em;display:flex;align-items:center;gap:12px;transition:transform .2s cubic-bezier(.2,.8,.2,1),background .2s,box-shadow .2s}.vay-btn:hover{transform:translateY(-2px);background:white;box-shadow:0 6px 24px rgba(255,255,255,.12)}.vay-btn:active{transform:scale(.95)}.vay-btn span{font-size:17px;line-height:10px}.composer[data-theme="paper"] .vay-btn{background:#25271f;color:#f0ede4}.composer[data-theme="oxblood"] .vay-btn{background:#f3e9dd;color:#601017}
    .feed-head{display:flex;align-items:center;justify-content:space-between;margin:53px 0 18px}.feed-head .section-label{margin:0;flex:1}.filter{display:flex;gap:18px;margin-left:25px}.filter button{background:none;border:0;color:#767970;font:10px var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:5px 0}.filter button.active{color:#f0efe8;border-bottom:1px solid #f0efe8}.feed{columns:3 270px;column-gap:34px;padding-bottom:90px}.note{break-inside:avoid;margin:0 0 34px;padding:5px 0 19px;background:transparent;color:#f0eee5;cursor:pointer;transition:transform .25s}.note:hover{transform:translateY(-3px)}.note[data-theme="forest"],.note[data-theme="graph"]{color:#b7d2ad}.note[data-theme="paper"]{color:#d8d1be}.note[data-theme="oxblood"]{color:#d98681}.note[data-theme="blue"]{color:#a8c3e0}.note[data-theme="lavender"]{color:#c5b4db}.note-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px;color:#71746a;font:9px var(--mono);letter-spacing:.12em;text-transform:uppercase}.note-mark{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.8}.note h2{font:400 clamp(27px,3vw,38px)/1.04 var(--serif);letter-spacing:-.025em;margin:0 0 12px;color:inherit}.note p{color:#aaa99f;font-size:13px;line-height:1.7;margin:0}.note[data-theme="paper"] p{color:#aaa391}.note-bottom{display:flex;align-items:center;justify-content:space-between;margin-top:17px;padding-top:11px;border-top:1px solid rgba(255,255,255,.1);font:9px var(--mono);color:#74766e}.note-tags{display:flex;gap:8px}.tag{color:inherit;opacity:.7}.empty{display:none;color:#777;font-size:13px;padding:35px 0}
    .toast{position:fixed;left:50%;bottom:30px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#eeeade;color:#181915;padding:12px 18px;font-size:12px;transition:.25s;z-index:10}.toast.show{opacity:1;transform:translate(-50%,0)}.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:8;align-items:center;justify-content:center;padding:20px}.modal.open{display:flex}.modal-card{max-width:680px;width:100%;padding:38px;background:#090909;color:#eeece2;position:relative;max-height:85vh;overflow:auto}.modal-card[data-theme="forest"]{background:#124e3c}.modal-card[data-theme="paper"]{background:#e8e3d6;color:#272720}.modal-card[data-theme="oxblood"]{background:#6e1118}.modal-card[data-theme="blue"]{background:#182f4e}.modal-card[data-theme="lavender"]{background:#403649}.modal-card h2{font:400 46px/1 var(--serif);margin:10px 0 20px}.modal-card p{line-height:1.8;white-space:pre-wrap}.modal-close{position:absolute;right:12px;top:10px;border:0;background:none;font-size:24px;opacity:.7;min-width:44px;min-height:44px}.modal-date{font:10px var(--mono);opacity:.65;letter-spacing:.12em;text-transform:uppercase}.footer{border-top:1px solid var(--line);padding:17px 0 25px;color:#65675e;font:9px var(--mono);display:flex;justify-content:space-between;letter-spacing:.1em;text-transform:uppercase}
    @media(max-width:760px){.shell{padding-left:max(18px,env(safe-area-inset-left));padding-right:max(18px,env(safe-area-inset-right))}.topbar{height:64px;gap:10px}.brand{font-size:18px}.nav{gap:12px}.nav a,.nav button{font-size:11px;white-space:nowrap}.intro{padding:54px 0 30px}.intro.started{top:64px;padding:10px 0}.intro h1{font-size:clamp(42px,11vw,58px);line-height:1;letter-spacing:-.04em}.intro.started h1{font-size:clamp(22px,6vw,27px)}.composer{padding:22px 18px 18px;min-height:260px}.compose-head{align-items:flex-start;flex-direction:column;gap:10px}.compose-kicker{display:none}.theme-picker{gap:0;margin-left:-5px}.editor{min-height:min(35vh,260px);font-size:16px;line-height:1.7}.compose-bottom{position:sticky;bottom:env(safe-area-inset-bottom);z-index:2;align-items:stretch;flex-wrap:wrap;gap:6px;margin:14px -4px 0;padding:9px 4px 0;background:inherit}.format-tools{order:1;flex:1 0 100%;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;-webkit-overflow-scrolling:touch}.format-tools::-webkit-scrollbar{display:none}.format-tools button{flex:0 0 42px}.compose-actions{order:2;justify-content:flex-end;flex:1;padding:2px 0}.word-count{font-size:10px}.vay-btn{padding:10px 19px}.feed{columns:2 210px;column-gap:20px}.feed-head{margin-top:40px}.modal{padding:12px}.modal-card{padding:30px 22px;max-height:calc(100dvh - 24px)}.modal-card h2{font-size:38px}.toast{bottom:calc(18px + env(safe-area-inset-bottom));max-width:calc(100vw - 36px);text-align:center}}@media(max-width:480px){.nav{gap:8px}.nav a:nth-child(2){display:none}.intro h1{font-size:clamp(40px,11.5vw,48px)}.intro.started h1{font-size:22px}.feed{columns:1}.note h2{font-size:34px}.footer{font-size:8px;gap:15px}.footer span:last-child{text-align:right}}
    @media(hover:hover){.note:hover{transform:translateY(-3px)}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <div class="grain" aria-hidden="true"></div>
  <div class="shell">
    <header class="topbar"><a class="brand" href="#top">vay<span>notes</span><i>·</i></a><nav class="nav"><a href="#notes">The notes</a><a href="#about">A lie about myself</a></nav></header>
    <main id="top">
      <section class="intro" id="about"><div><h1 id="entryTitle" contenteditable="true" role="textbox" aria-label="Note title" aria-multiline="false" data-placeholder="how do you know me"></h1></div></section>
      <section class="composer" id="composer" data-theme="dark" aria-label="Write a note">
        <div class="compose-head"><span class="compose-kicker">Pick a feeling, find a color</span><div class="theme-picker" aria-label="Choose a writing pad theme">
          <button class="theme-dot active" style="--swatch:#171915" data-theme="dark" aria-label="Ink black" title="Ink black"></button><button class="theme-dot" style="--swatch:#126348" data-theme="forest" aria-label="Forest" title="Forest"></button><button class="theme-dot" style="--swatch:#e8e3d6" data-theme="paper" aria-label="Paper" title="Paper"></button><button class="theme-dot" style="--swatch:#6e1118" data-theme="oxblood" aria-label="Oxblood" title="Oxblood"></button><button class="theme-dot" style="--swatch:#182f4e" data-theme="blue" aria-label="Night blue" title="Night blue"></button><button class="theme-dot" style="--swatch:#403649" data-theme="lavender" aria-label="Dusk" title="Dusk"></button><button class="theme-dot" style="--swatch:#164e3b" data-theme="graph" aria-label="Green graph paper" title="Green graph paper"></button>
        </div></div>
        <div class="editor" id="bodyInput" contenteditable="true" role="textbox" aria-label="Note body" aria-multiline="true" data-placeholder="Start anywhere. You can figure out the rest as you go…"></div>
        <div class="compose-bottom"><div class="format-tools" aria-label="Formatting"><button data-command="bold" title="Bold"><b>B</b></button><button data-command="italic" title="Italic"><i>I</i></button><button data-command="formatBlock" data-value="H2" title="Heading">H</button><button data-command="formatBlock" data-value="BLOCKQUOTE" title="Quote">❝</button><button data-command="insertUnorderedList" title="Bullet list">☷</button><button id="linkButton" title="Add link">↗</button></div><div class="compose-actions"><span class="word-count" id="wordCount">0 words</span><button class="vay-btn" id="publishBtn">Vay <span>↗</span></button></div></div>
      </section>
      <section id="notes"><div class="feed-head"><div class="section-label"><span>02 — Out in the open</span></div><div class="filter"><button class="active" data-filter="all">All notes</button><button data-filter="recent">Recent</button></div></div><div class="feed" id="feed"></div><div class="empty" id="empty">Nothing here yet. Leave the first thought.</div></section>
    </main>
    <footer class="footer"><span>Vaynotes — a place for thoughts</span><span>Keep what moves you · <a href="/admin" target="_top" style="color:inherit;text-decoration:none">Admin</a></span></footer>
  </div>
  <div class="toast" id="toast" role="status"></div>
  <div class="modal" id="modal" role="dialog" aria-modal="true"><article class="modal-card" id="modalCard"><button class="modal-close" id="modalClose" aria-label="Close">×</button><div class="modal-date" id="modalDate"></div><h2 id="modalTitle"></h2><div id="modalBody"></div></article></div>
  <script>
    (()=>{
      const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
      const composer=$('#composer'),entryTitle=$('#entryTitle'),intro=$('#about'),body=$('#bodyInput'),feed=$('#feed'),toast=$('#toast');let theme='dark',filter='all',toastTimer;
      const samples=[
        {id:'s1',title:'On beginning before you’re ready',body:'There is a particular kind of clarity that only arrives after you begin. Before that, every possible version of the thing is competing for attention. The first sentence makes the room quieter.',theme:'paper',date:'2026-10-21',tags:['on making','reminder']},
        {id:'s2',title:'The shape of a good day',body:'A window open. Something simmering. A message from someone I miss. The feeling that I have been where my feet are for at least a little while.',theme:'forest',date:'2026-10-18',tags:['small things']},
        {id:'s3',title:'A note to future me',body:'You don’t have to turn every interest into a project. Some things can just be lovely to know about.',theme:'oxblood',date:'2026-10-12',tags:['for later']},
        {id:'s4',title:'Maybe the point is to notice',body:'The late light on the kitchen floor. A stranger being kind without making a thing of it. The song you haven’t heard in years and somehow still know by heart.',theme:'blue',date:'2026-10-09',tags:['observations']},
        {id:'s5',title:'Things I want to remember',body:'That walking is a kind of thinking. That a slow answer can be a good answer. That starting over is allowed to feel like relief.',theme:'lavender',date:'2026-10-02',tags:['list','life']},
        {id:'s6',title:'An unfinished thought',body:'What if paying attention is its own way of loving something?',theme:'graph',date:'2026-09-28',tags:['question']}
      ];
      let notes=JSON.parse(localStorage.getItem('vaynotes-posts')||'null')||samples;
      const save=()=>localStorage.setItem('vaynotes-posts',JSON.stringify(notes));
      const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
      function safeMarkup(markup){const template=document.createElement('template');template.innerHTML=markup;const allowed=new Set(['P','BR','B','STRONG','I','EM','U','UL','OL','LI','BLOCKQUOTE','H2','H3','A']);const walk=node=>[...node.childNodes].forEach(child=>{if(child.nodeType===1){if(!allowed.has(child.tagName)){child.replaceWith(...child.childNodes);return}const href=child.tagName==='A'?child.getAttribute('href'):null;[...child.attributes].forEach(attr=>child.removeAttribute(attr.name));if(href){try{const url=new URL(href,location.href);if(url.protocol==='https:'||url.protocol==='http:'){child.setAttribute('href',url.href);child.setAttribute('rel','noopener noreferrer')}}catch{}}walk(child)}});walk(template.content);return template.innerHTML}
      function showToast(msg){toast.textContent=msg;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),2300)}
      function dateLabel(d){return new Date(d+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}
      function render(){let list=[...notes].sort((a,b)=>b.date.localeCompare(a.date));if(filter==='recent')list=list.slice(0,3);feed.innerHTML=list.map(n=>`<article class="note" data-theme="${n.theme}" data-id="${escapeHtml(n.id)}" tabindex="0"><div class="note-top"><span>${dateLabel(n.date)}</span><span class="note-mark"></span></div><h2>${escapeHtml(n.title)}</h2><p>${escapeHtml(n.body.replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').slice(0,190))}${n.body.replace(/<[^>]*>/g,'').length>190?'…':''}</p><div class="note-bottom"><span>VAYNOTE Nº ${String(notes.indexOf(n)+1).padStart(2,'0')}</span><span class="note-tags">${n.tags.map(t=>`<span class="tag">#${escapeHtml(t)}</span>`).join('')}</span></div></article>`).join('');$('#empty').style.display=list.length?'none':'block';$$('.note').forEach(el=>{el.addEventListener('click',()=>openNote(el.dataset.id));el.addEventListener('keydown',e=>{if(e.key==='Enter')openNote(el.dataset.id)})})}
      function openNote(id){const n=notes.find(x=>x.id===id);if(!n)return;const card=$('#modalCard');card.dataset.theme=n.theme;$('#modalDate').textContent=dateLabel(n.date)+' · VAYNOTE';$('#modalTitle').textContent=n.title;$('#modalBody').innerHTML=safeMarkup(n.body);$('#modal').classList.add('open')}
      let hasStarted=false;
      entryTitle.addEventListener('input',()=>{
        const value=entryTitle.innerText.replace(/[\r\n]+/g,' ').trim();
        if(value&&!hasStarted){hasStarted=true;intro.classList.add('started');setTimeout(()=>body.focus(),420)}
      });
      entryTitle.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();if(!hasStarted&&entryTitle.innerText.trim()){hasStarted=true;intro.classList.add('started')}body.focus()}});
      $$('.theme-dot').forEach(btn=>btn.addEventListener('click',()=>{theme=btn.dataset.theme;composer.dataset.theme=theme;$$('.theme-dot').forEach(b=>b.classList.toggle('active',b===btn));localStorage.setItem('vaynotes-theme',theme)}));
      const remembered=localStorage.getItem('vaynotes-theme');if(remembered){const b=$(`.theme-dot[data-theme="${remembered}"]`);if(b)b.click()}
      body.addEventListener('input',()=>{const words=body.innerText.trim().split(/\s+/).filter(Boolean).length;$('#wordCount').textContent=words+' '+(words===1?'word':'words')});
      $$('.format-tools [data-command]').forEach(b=>b.addEventListener('click',()=>{body.focus();document.execCommand(b.dataset.command,false,b.dataset.value||null)}));
      $('#linkButton').addEventListener('click',()=>{body.focus();const url=prompt('Paste a link');if(url)document.execCommand('createLink',false,url)});
      $('#publishBtn').addEventListener('click',async()=>{const t=entryTitle.innerText.trim(),content=body.innerHTML.trim(),plain=body.innerText.trim();if(!t&&!plain){showToast('Start with a thought before you Vay it.');entryTitle.focus();return}const note={id:Date.now().toString(),title:t||plain.split('\n')[0].slice(0,70),body:content,theme,date:new Date().toISOString().slice(0,10),tags:['just now']};const button=$('#publishBtn');button.disabled=true;try{const response=await fetch('/api/notes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(note)});if(!response.ok)throw new Error('');const saved=await response.json();notes.unshift(saved);save();render();entryTitle.textContent='';intro.classList.remove('started');hasStarted=false;body.innerHTML='';$('#wordCount').textContent='0 words';if(navigator.vibrate)navigator.vibrate([18,35,28]);showToast('Vayed. Your thought is out in the open.');document.querySelector('#notes').scrollIntoView({behavior:'smooth',block:'start'})}catch{showToast('Connect the Vercel database before publishing. Your draft is still here.')}finally{button.disabled=false}});
      $$('.filter button').forEach(b=>b.addEventListener('click',()=>{filter=b.dataset.filter;$$('.filter button').forEach(x=>x.classList.toggle('active',x===b));render()}));
      $('#modalClose').addEventListener('click',()=>$('#modal').classList.remove('open'));$('#modal').addEventListener('click',e=>{if(e.target===$('#modal'))$('#modal').classList.remove('open')});document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#modal').classList.remove('open')});render();
      fetch('/api/notes',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error();return r.json()}).then(remote=>{notes=remote;save();render()}).catch(()=>{});
    })();
  </script>
</body>
</html>
